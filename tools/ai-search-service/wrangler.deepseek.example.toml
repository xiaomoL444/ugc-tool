name = "ugc-ai-search"
main = "worker.mjs"
compatibility_date = "2025-04-01"

[[durable_objects.bindings]]
name = "SEARCH_LEDGER"
class_name = "SearchLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SearchLedger"]

[vars]
# Trusted base; SoundEffectPlayer, EffectPlayer and BgmPlayer features plus five locale files.
ASSET_FEATURES_BASE_URL = "https://oss.xiaomol444.xyz/ugc-tool-data"
# Public Markdown source; successful reads are cached for 60 seconds.
SYSTEM_PROMPT_URL = "https://oss.xiaomol444.xyz/ugc-tool-data/AISearch/SystemPrompt.md"
UPSTREAM_URL = "https://api.deepseek.com/chat/completions"
MODEL = "deepseek-flash"
MODEL_NAME = "DeepSeek 免费搜索"
UPSTREAM_THINKING = "disabled"
# Add your production website origin before publishing the Vue site.
ALLOWED_ORIGINS = "http://127.0.0.1:8080,http://localhost:8080"
GUEST_DAILY_LIMIT = "5"
MONTHLY_BUDGET_CNY = "50"
# Balance checks apply only to the official api.deepseek.com upstream.
# Includes granted CNY balance; this does not lock the provider account.
MIN_BALANCE_CNY = "20"
# DeepSeek official CNY/million-token PEAK prices, checked 2026-10-08.
# Reserve at the cache-miss input rate; this ledger is not the provider's bill.
# Recheck https://api-docs.deepseek.com/zh-cn/quick_start/pricing/ when changing models or prices.
INPUT_CNY_PER_MILLION = "2"
OUTPUT_CNY_PER_MILLION = "8"
COST_SAFETY_FACTOR = "1.25"
MAX_CANDIDATES = "50"
MAX_MESSAGES = "12"
MAX_QUERY_LENGTH = "2000"
MAX_PROMPT_BYTES = "30000"
MAX_OUTPUT_TOKENS = "5400"
MAX_CONCURRENCY = "4"
UPSTREAM_TIMEOUT_MS = "30000"
RETRIEVAL_MODE = "keyword"
# Optional query embeddings require ASSET_VECTORIZE, its matching seeded namespace,
# EMBEDDING_API_KEY and a positive current CNY/million-token price. Zero keeps them off.
EMBEDDING_URL = "https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding"
EMBEDDING_MODEL = "text-embedding-v4"
EMBEDDING_DIMENSIONS = "1024"
EMBEDDING_CNY_PER_MILLION = "0"
EMBEDDING_DAILY_LIMIT = "20"

# Add using npx wrangler secret put; never save values in this file:
# UPSTREAM_API_KEY (a DeepSeek official API key)
# VISITOR_HASH_SECRET (a fixed random string)
# EMBEDDING_API_KEY (a separate DashScope embedding key, not the DeepSeek key)

# Enable only after manually creating, indexing and seeding a matching Vectorize index:
# [[vectorize]]
# binding = "ASSET_VECTORIZE"
# index_name = "ugc-assets-v4-1024"
